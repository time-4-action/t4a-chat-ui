services:
  ai-agent-ui:
    image: etiamsi/t4a-ai-agent-ui:latest
    network_mode: host   # container uses host network → MongoDB sees server's real IP
    env_file:
      - .env.local
    # Override AUTH0_BASE_URL for production — change to your actual domain
    environment:
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-http://localhost:3000}
      PORT: 3003          # app listens on 3003 directly (ports: ignored with host networking)
    restart: unless-stopped
